name: 台灣大樂透手機雲端自主修復
on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "35-55/10 14 * * 2,5"
    - cron: "5-55/10 15 * * 2,5"
    - cron: "5-35/10 16 * * 2,5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tw649-pages-watchdog
  cancel-in-progress: true
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: 線上手機版逐項驗證與Pages修復判定
        run: python pages_watchdog.py
      - name: 觸發Pages重新建置
        run: |
          if git diff --quiet -- docs/.pages-repair-trigger.json; then
            echo "手機雲端同步正常，無需修復提交。"
            exit 0
          fi
          git config user.name "tw649-pages-watchdog"
          git config user.email "actions@github.com"
          git add docs/.pages-repair-trigger.json
          git commit -m "手機雲端Pages自主修復重建"
          git pull --rebase origin main
          git push
      - name: 保存線上驗證診斷
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw649-cloud-watchdog-${{ github.run_id }}
          path: reports/live_cloud_verification.json
          if-no-files-found: ignore
          retention-days: 14
