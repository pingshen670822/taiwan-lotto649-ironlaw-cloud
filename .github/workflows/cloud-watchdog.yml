name: 台灣大樂透手機雲端自主修復
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  schedule:
    - cron: "17 */3 * * *"
    - cron: "35-55/10 14 * * 2,5"
    - cron: "5-55/10 15 * * 2,5"
    - cron: "5-35/10 16 * * 2,5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tw649-pages-watchdog
  cancel-in-progress: true
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with: {python-version: "3.12"}
      - name: 排程發現舊期別時重抓、重算並發布
        id: data-repair
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          python auto_repair.py
          TODAY_TAIPEI="$(TZ=Asia/Taipei date +%F)"
          PUBLISHED_DATE="$(git show HEAD:docs/mobile_cloud/latest_analysis.json | python -c 'import json,sys; print(json.load(sys.stdin).get("generated_at","")[:10])')"
          if git diff --quiet -- data/official_lotto649.csv && [ "$PUBLISHED_DATE" = "$TODAY_TAIPEI" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "tw649-cloud-self-repair"
          git config user.email "actions@github.com"
          git add data reports site docs mobile_cloud
          if git diff --cached --quiet -- data/official_lotto649.csv; then
            git commit -m "大樂透雲端每日日期自主修復"
          else
            git commit -m "大樂透雲端逾時自主修復更新"
          fi
          git pull --rebase origin main
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"
      - name: 等待Pages完成新版部署
        if: github.event_name == 'push' || steps.data-repair.outputs.updated == 'true'
        run: sleep 75
      - name: 線上手機版逐項驗證與Pages修復判定
        run: python pages_watchdog.py
      - name: 觸發Pages重新建置
        run: |
          if git diff --quiet -- docs/.pages-repair-trigger.json reports/self_repair_status.json site/self_repair_status.json docs/self_repair_status.json mobile_cloud/self_repair_status.json docs/mobile_cloud/self_repair_status.json; then
            echo "手機雲端同步正常，無需修復提交。"
            exit 0
          fi
          git config user.name "tw649-pages-watchdog"
          git config user.email "actions@github.com"
          git add docs/.pages-repair-trigger.json reports/self_repair_status.json site/self_repair_status.json docs/self_repair_status.json mobile_cloud/self_repair_status.json docs/mobile_cloud/self_repair_status.json
          if git diff --cached --quiet -- docs/.pages-repair-trigger.json; then
            git commit -m "手機雲端實網驗證健康"
          else
            git commit -m "手機雲端Pages自主修復重建"
          fi
          git pull --rebase origin main
          git push
      - name: 保存線上驗證診斷
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw649-cloud-watchdog-${{ github.run_id }}
          path: reports/live_cloud_verification.json
          if-no-files-found: ignore
          retention-days: 14
